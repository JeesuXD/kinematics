; Exam Countdown: Rainmeter skin (Windows)
; Shows hours left until JEE Main, CBSE Class 12 boards and JEE Advanced.
; To change a date: edit the [Variables] section below, save, then right-click
; the widget > Refresh skin. Dates use your PC's clock (keep it on IST).

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Exam Countdown
Information=Hours left until JEE Main, CBSE Class 12 boards and JEE Advanced. Edit the dates in [Variables].
Version=1.0
License=MIT

[Variables]
; ---- Edit these (format: YYYY-MM-DD HH:MM, 24-hour) ----
Exam1Name=JEE Main (Session 1)
Exam1Date=2027-01-20 09:00
Exam2Name=CBSE Class 12 Boards
Exam2Date=2027-02-16 10:30
Exam3Name=JEE Advanced
Exam3Date=2027-05-16 09:00
; Put "(tentative)" here, or leave it empty once dates are official
Tag=(tentative)
; ---- Look ----
Font=Segoe UI
Width=270
ColorBg=17,20,28,225
ColorCard=26,31,43,255
ColorText=242,244,248,255
ColorDim=138,147,166,255
Color1=255,159,67,255
Color2=77,171,247,255
Color3=177,151,252,255

; ================= Measures =================

[MeasureNow]
Measure=Time

[MeasureClock]
Measure=Time
Format=%d %b, %I:%M %p

[MeasureTarget1]
Measure=Time
TimeStamp=#Exam1Date#
TimeStampFormat=%Y-%m-%d %H:%M

[MeasureTarget2]
Measure=Time
TimeStamp=#Exam2Date#
TimeStampFormat=%Y-%m-%d %H:%M

[MeasureTarget3]
Measure=Time
TimeStamp=#Exam3Date#
TimeStampFormat=%Y-%m-%d %H:%M

[MeasureHours1]
Measure=Calc
Formula=Max(0, Floor((MeasureTarget1 - MeasureNow) / 3600))

[MeasureDays1]
Measure=Calc
Formula=Max(0, Floor((MeasureTarget1 - MeasureNow) / 86400))

[MeasureHours2]
Measure=Calc
Formula=Max(0, Floor((MeasureTarget2 - MeasureNow) / 3600))

[MeasureDays2]
Measure=Calc
Formula=Max(0, Floor((MeasureTarget2 - MeasureNow) / 86400))

[MeasureHours3]
Measure=Calc
Formula=Max(0, Floor((MeasureTarget3 - MeasureNow) / 3600))

[MeasureDays3]
Measure=Calc
Formula=Max(0, Floor((MeasureTarget3 - MeasureNow) / 86400))

; ================= Styles =================

[StyleName]
FontFace=#Font#
FontSize=10
FontWeight=700
FontColor=#ColorText#
AntiAlias=1
X=24
ClipString=1
W=(#Width# - 40)

[StyleHours]
FontFace=#Font#
FontSize=20
FontWeight=700
AntiAlias=1
NumOfDecimals=0
X=23
Text=%1

[StyleUnit]
FontFace=#Font#
FontSize=10
FontColor=#ColorDim#
AntiAlias=1
Text=hrs left
X=4R

[StyleDetail]
FontFace=#Font#
FontSize=9
FontColor=#ColorDim#
AntiAlias=1
NumOfDecimals=0
X=24

; ================= Meters =================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#Width#,320,12 | Fill Color #ColorBg# | StrokeWidth 0

[MeterTitle]
Meter=String
Text=EXAM COUNTDOWN
FontFace=#Font#
FontSize=9
FontWeight=700
FontColor=#ColorDim#
AntiAlias=1
X=14
Y=12

[MeterClock]
Meter=String
MeasureName=MeasureClock
FontFace=#Font#
FontSize=9
FontColor=#ColorDim#
AntiAlias=1
StringAlign=Right
X=(#Width# - 14)
Y=12

; ---- Exam 1 ----
[MeterCard1]
Meter=Shape
Shape=Rectangle 12,40,(#Width# - 24),84,6 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 12,40,4,84 | Fill Color #Color1# | StrokeWidth 0

[MeterName1]
Meter=String
MeterStyle=StyleName
Text=#Exam1Name#  #Tag#
Y=46

[MeterHours1]
Meter=String
MeterStyle=StyleHours
MeasureName=MeasureHours1
FontColor=#Color1#
Y=62

[MeterUnit1]
Meter=String
MeterStyle=StyleUnit
Y=76

[MeterDetail1]
Meter=String
MeterStyle=StyleDetail
MeasureName=MeasureDays1
Text=%1 days | #Exam1Date#
Y=100

; ---- Exam 2 ----
[MeterCard2]
Meter=Shape
Shape=Rectangle 12,132,(#Width# - 24),84,6 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 12,132,4,84 | Fill Color #Color2# | StrokeWidth 0

[MeterName2]
Meter=String
MeterStyle=StyleName
Text=#Exam2Name#  #Tag#
Y=138

[MeterHours2]
Meter=String
MeterStyle=StyleHours
MeasureName=MeasureHours2
FontColor=#Color2#
Y=154

[MeterUnit2]
Meter=String
MeterStyle=StyleUnit
Y=168

[MeterDetail2]
Meter=String
MeterStyle=StyleDetail
MeasureName=MeasureDays2
Text=%1 days | #Exam2Date#
Y=192

; ---- Exam 3 ----
[MeterCard3]
Meter=Shape
Shape=Rectangle 12,224,(#Width# - 24),84,6 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 12,224,4,84 | Fill Color #Color3# | StrokeWidth 0

[MeterName3]
Meter=String
MeterStyle=StyleName
Text=#Exam3Name#  #Tag#
Y=230

[MeterHours3]
Meter=String
MeterStyle=StyleHours
MeasureName=MeasureHours3
FontColor=#Color3#
Y=246

[MeterUnit3]
Meter=String
MeterStyle=StyleUnit
Y=260

[MeterDetail3]
Meter=String
MeterStyle=StyleDetail
MeasureName=MeasureDays3
Text=%1 days | #Exam3Date#
Y=284
